org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.88
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
neo_form_version=26.2-2
loader_version_range=[1,)
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players (Forge Config
# API Port 26.2 needs Fabric Loader 0.19.0 and Fabric API 0.152.0 itself).
fabric_loader_version=0.20.1
fabric_loader_min_version=0.19.0
fabric_api_version=0.161.0+26.2
fabric_api_min_version=0.152.0
# Forge's config API on Fabric (https://www.curseforge.com/minecraft/mc-mods/forge-config-api-port); its NeoForge
# API lets common compile Config against plain Minecraft.
forge_config_api_port_version=26.2.1

## Optional dependencies
# The 26.2 build of Serene Seasons carries the version number 26.1.2.0.6 (beta).
serene_seasons_version=26.1.2.0.6
glitchcore_version=26.2.0.0.0

## Mod
mod_id=rustling_leaves
mod_name=Rustling Leaves
mod_version=2.8.0
mod_group_id=com.pockyl.rustling_leaves
mod_license=MIT
mod_authors=Pocky
mod_description=Physically simulated leaves: falling leaves, leaf piles you can wade through and rake, gusts and whirlwinds. Client-side, works on any server.
mod_url=https://github.com/Pocky-l/rustling-leaves

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1729578
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs.
curseforge_requires=
curseforge_optional=serene-seasons,realistic-waves
# The Fabric jar also needs Fabric API and Forge Config API Port.
curseforge_requires_fabric=fabric-api,forge-config-api-port
modrinth_requires_fabric=fabric-api,forge-config-api-port
# Modrinth: works on the client alone, the server part is optional.
modrinth_environment=client_only_server_optional
