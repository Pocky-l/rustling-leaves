modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_url}/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_url}"
logoFile="logo.png"
description='''${mod_description}'''
# Client-side: it works on any server, with or without the mod (installed on a server it also shares rake strokes).
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Leaf fall follows its seasons.
[[dependencies.${mod_id}]]
    modId="sereneseasons"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# Its leaf piles are drawn as leaf litter.
[[dependencies.${mod_id}]]
    modId="immersive_weathering"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# Floating leaves ride its waves.
[[dependencies.${mod_id}]]
    modId="whitecap"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# Its leaf particles are left out while this mod drops the leaves.
[[dependencies.${mod_id}]]
    modId="fallingleaves"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# Leaves blow with its wind; its own canopy leaves are left out.
[[dependencies.${mod_id}]]
    modId="livingwind"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
