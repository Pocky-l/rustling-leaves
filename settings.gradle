pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'rustling_leaves'

// common: the code shared by the loaders, compiled against vanilla Minecraft; neoforge: the loader glue. Each loader
// project compiles the common sources into its own jar.
include 'common', 'neoforge'
