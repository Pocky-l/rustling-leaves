plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // The config: NeoForge's ModConfigSpec, config files and config screen on Fabric, so both loaders share Config and
    // its file.
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    modCompileOnly "com.github.glitchfiend:SereneSeasons-fabric:${minecraft_version}-${serene_seasons_version}"
    modCompileOnly "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${glitchcore_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
            runDir('run-server')
        }
    }
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_min_version,
            fabric_api_version   : fabric_api_min_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_url              : mod_url,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (Fabric)"
    modLoaders.add('fabric')

    curseforge {
        curseforge_requires_fabric.split(',')*.trim().findAll().each { requires(it) }
    }
}
